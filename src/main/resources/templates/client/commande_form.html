<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Commande — ParcelFlow</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="page">
    <div th:replace="~{fragments/header :: header('ParcelFlow', 'Client')}"></div>

    <div class="auth-header">
        <div class="brand-mark">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <h1>Nouvelle Commande</h1>
        <p>Saisissez les détails de votre livraison</p>
    </div>

    <div class="card">
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>

        <form method="post" th:action="@{/client/orders/new}">
            <div class="field">
                <label for="montant">Montant estimé (FCFA)</label>
                <div class="input-wrap">
                    <span class="field-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                    </span>
                    <input id="montant" type="number" name="montant" step="0.01" placeholder="Ex: 5000" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                Passer la commande
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </button>
        </form>
        <div class="card-footer">
            <a th:href="@{/client/orders}">Retour à mes commandes</a>
        </div>
    </div>
</div>
</body>
</html>
